name: CI
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      full:
        description: Run all platforms and supported Python versions
        type: boolean
        default: true
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}
env:
  UV_VERSION: "0.11.27"
jobs:
  # Filtering the workflow by paths would leave the required check pending.
  ci-ok:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FULL: ${{ inputs.full || false }}
        run: python3 scripts/ci_scope.py
      - if: steps.scope.outputs.python == 'true' || steps.scope.outputs.web == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - if: steps.scope.outputs.python == 'true' || steps.scope.outputs.web == 'true'
        run: uv sync --locked
      - if: steps.scope.outputs.python == 'true'
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q
      - if: steps.scope.outputs.deps == 'true'
        run: uv run --isolated --no-project --resolution lowest-direct --with-editable . --with "pytest>=8" --with httpx2 python -m pytest -q
      - if: steps.scope.outputs.web == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.scope.outputs.web == 'true'
        run: npm ci --no-audit --no-fund
        working-directory: web
      - if: steps.scope.outputs.web == 'true'
        run: |
          npm run build
          npm run test
        working-directory: web
      - if: steps.scope.outputs.audit == 'true'
        run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - if: steps.scope.outputs.api == 'true'
        run: |
          npm run gen:api
          git diff --exit-code -- openapi.json src/api/schema.d.ts
        working-directory: web
      - if: steps.scope.outputs.web == 'true'
        id: pw
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: web
      - if: steps.scope.outputs.web == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.scope.outputs.web == 'true'
        run: |
          npx playwright install --with-deps chromium
          npm run e2e -- --workers=2
        working-directory: web
      - if: steps.scope.outputs.package == 'true'
        run: |
          uv build
          uv run python scripts/check_build.py dist/vibewatt-*.tar.gz
          uv run python scripts/check_wheel.py dist/vibewatt-*-py3-none-any.whl --browser
      - if: inputs.full
        uses: actions/upload-artifact@v7
        with:
          name: ci-dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # Compatibility checks run before releases or on explicit manual request.
  python-compat:
    needs: ci-ok
    if: inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --python '${{ matrix.python }}'
      - run: uv run --python '${{ matrix.python }}' pytest -q
      - run: uv run --python '${{ matrix.python }}' python -c "import vibewatt; print(vibewatt.__file__)"
      - run: uv run --python '${{ matrix.python }}' vibewatt --help

  platform:
    needs: ci-ok
    if: inputs.full
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            wheel: true
          - os: macos-latest
            wheel: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: uv run pytest -q
      - if: matrix.wheel
        uses: actions/download-artifact@v8
        with:
          name: ci-dist
          path: dist/
      - if: matrix.wheel
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: matrix.wheel
        run: cd web && npm ci --no-audit --no-fund
      - if: matrix.wheel
        id: pw
        run: echo "version=$(node -p "require('./web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - if: matrix.wheel
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: matrix.wheel
        run: |
          cd web && npx playwright install chromium
          cd ..
          uv run python scripts/check_wheel.py dist/vibewatt-*-py3-none-any.whl --browser
