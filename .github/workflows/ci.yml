name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A new push to the same PR or branch makes the older run worthless.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  UV_VERSION: "0.11.27"
jobs:
  # Path filtering happens here instead of in `on.paths`: a workflow that never
  # starts leaves required checks pending, while skipped jobs report success.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      code: ${{ steps.filter.outputs.code }}
      deps: ${{ steps.filter.outputs.deps }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$BASE" ] || [ "$BASE" = "$zero" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "deps=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE" HEAD)
          echo "$files"
          code=false; deps=false; docs=false
          while IFS= read -r f; do
            case "$f" in
              "") ;;
              # tests/test_analysis_wrapped.py reads docs/PLAN.md.
              docs/PLAN.md) code=true; docs=true ;;
              docs/*|*.md) docs=true ;;
              LICENSE|.github/ISSUE_TEMPLATE/*|.github/dependabot.yml) ;;
              *) code=true ;;
            esac
            case "$f" in pyproject.toml|uv.lock) deps=true ;; esac
          done <<< "$files"
          [ "$EVENT" = push ] && deps=$code
          [ "$EVENT" = workflow_dispatch ] && docs=true
          echo "code=$code" >> "$GITHUB_OUTPUT"; echo "deps=$deps" >> "$GITHUB_OUTPUT"; echo "docs=$docs" >> "$GITHUB_OUTPUT"

  # Everything that is not platform specific runs once, on Linux.
  full:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run test
        working-directory: web
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - run: npm run gen:api
        working-directory: web
      - run: git diff --exit-code -- web/openapi.json web/src/api/schema.d.ts
      - run: uv run pytest -q
      # The dependency floors only move when pyproject.toml or uv.lock does.
      - if: needs.changes.outputs.deps == 'true'
        run: uv run --isolated --no-project --resolution lowest-direct --with-editable . --with "pytest>=8" --with httpx2 python -m pytest -q
      - id: pw
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: web
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
      - run: uv build
      - run: uv run python scripts/check_build.py dist/vibewatt-*.tar.gz
      - run: uv run python scripts/check_wheel.py dist/vibewatt-*-py3-none-any.whl --browser

  # Windows and macOS only run what differs by platform: path handling and data
  # directories (pytest), plus the installed-wheel gate on Windows.
  platform:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            wheel: true
          - os: macos-latest
            wheel: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        # pwsh, the Windows default, does not expand the dist/ globs.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: uv run pytest -q
      - if: matrix.wheel
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: matrix.wheel
        run: cd web && npm ci && npm run build
      # check_wheel.py --browser drives Chromium through Playwright.
      - if: matrix.wheel
        id: pw
        run: echo "version=$(node -p "require('./web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - if: matrix.wheel
        uses: actions/cache@v5
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: matrix.wheel
        run: cd web && npx playwright install chromium
      - if: matrix.wheel
        run: |
          uv build
          uv run python scripts/check_wheel.py dist/vibewatt-*-py3-none-any.whl --browser


  docs-links:
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --no-dev
        continue-on-error: true
      - name: Check Markdown links
        run: python scripts/check_markdown_links.py
      - name: Fixture self-check
        run: |
          python scripts/check_markdown_links.py tests/fixtures/markdown_links/valid
          if python scripts/check_markdown_links.py tests/fixtures/markdown_links/broken; then
            echo "expected broken fixture to fail" >&2
            exit 1
          fi

  # The one check branch protection requires. It passes when the code jobs pass
  # or were skipped because only documentation changed.
  ci-ok:
    needs: [changes, full, platform, docs-links]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
