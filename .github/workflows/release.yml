name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.27"
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - id: version
        # The tag, the package, the module and the frontend must name one version.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          python3 - "$tag" <<'PY'
          import json, re, sys, tomllib
          tag = sys.argv[1]
          found = {
              "pyproject.toml": tomllib.load(open("pyproject.toml", "rb"))["project"]["version"],
              "vibewatt/__init__.py": re.search(r'__version__ = "([^"]+)"', open("vibewatt/__init__.py").read())[1],
              "web/package.json": json.load(open("web/package.json"))["version"],
          }
          wrong = {k: v for k, v in found.items() if v != tag}
          if wrong:
              sys.exit(f"tag v{tag} does not match {wrong}")
          if f"## {tag} " not in open("CHANGELOG.md").read():
              sys.exit(f"CHANGELOG.md has no section for {tag}")
          PY
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - run: uv sync --locked
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: uv build
      - run: uv run python scripts/check_build.py dist/vibewatt-*.tar.gz
      - run: uv run python scripts/check_wheel.py dist/vibewatt-*-py3-none-any.whl
      - run: cd dist && sha256sum vibewatt-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI accepts this workflow's OIDC identity, so no token is stored.
    environment:
      name: pypi
      url: https://pypi.org/project/vibewatt/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: rm dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          awk -v v="## $VERSION " 'index($0, v) == 1 {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          printf '\n### SHA-256\n\n```\n%s\n```\n' "$(cat dist/SHA256SUMS)" >> notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "vibewatt $VERSION" --notes-file notes.md --verify-tag
