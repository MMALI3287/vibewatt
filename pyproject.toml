[project]
name = "vibewatt"
version = "0.4.0"
description = "Token usage, cost and plan utilization for Claude Code and Cowork, from local data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MD Musaddique Ali Erfan" }]
keywords = ["claude", "claude-code", "cowork", "usage", "tokens", "cost"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Software Development",
]
dependencies = [
  "fastapi>=0.141.1",
  "uvicorn>=0.53",
  # Windows ships no IANA database, so ZoneInfo("Asia/Tokyo") fails without it (A-058).
  "tzdata>=2024.1; sys_platform == 'win32'",
  "tzlocal>=5.3",
]

[project.urls]
Homepage = "https://github.com/MMALI3287/vibewatt"
Issues = "https://github.com/MMALI3287/vibewatt/issues"
Documentation = "https://github.com/MMALI3287/vibewatt/tree/master/docs"

[project.scripts]
vibewatt = "vibewatt.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.16.7",
  "httpx2",
]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends(...) as a parameter default is the documented pattern, not
# the mutable-default-argument bug B008 flags.
"vibewatt/api/routes.py" = ["B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vibewatt"]

# An explicit list keeps stray local files (old builds, browser captures) out of
# the source archive. Hatch only honours the root .gitignore.
[tool.hatch.build.targets.sdist]
only-include = [
  ".github", "docs", "scripts", "tests", "vibewatt", "web",
  ".gitattributes", ".gitignore", "AGENTS.md", "CHANGELOG.md", "CLAUDE.md",
  "CODE_OF_CONDUCT.md", "CONTRIBUTING.md", "LICENSE", "README.md", "SECURITY.md",
  "pyproject.toml", "uv.lock",
]

[tool.hatch.build]
artifacts = ["vibewatt/static/**", "!vibewatt/static/**/*.map"]
exclude = ["vibewatt/static/**/*.map"]

[tool.hatch.build.hooks.custom]
path = "scripts/build_hook.py"

[tool.pytest.ini_options]
filterwarnings = [
  "ignore:The anyio.abc.BlockingPortal alias is deprecated.*:DeprecationWarning:starlette.testclient",
]
