[project]
name = "ccburn"
version = "0.3.0"
description = "Token usage, cost and plan utilization for Claude Code and Cowork, from local data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MD Musaddique Ali Erfan" }]
keywords = ["claude", "claude-code", "cowork", "usage", "tokens", "cost"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/MMALI3287/ccburn"

[project.scripts]
ccburn = "ccburn.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.16.7",
  "httpx>=0.27",
]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends(...) as a parameter default is the documented pattern, not
# the mutable-default-argument bug B008 flags.
"ccburn/api/routes.py" = ["B008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ccburn"]
